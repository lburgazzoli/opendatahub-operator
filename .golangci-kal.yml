version: "2"
linters:
  default: none
  enable:
    - kubeapilinter
  settings:
    custom:
      kubeapilinter:
        type: module
        description: "KAL is the Kube-API-Linter and lints Kube like APIs based on API conventions and best practices."
        settings:
          # Available linters are defined here https://github.com/kubernetes-sigs/kube-api-linter/tree/main/docs
          linters:
            enable:
              # All root objects that have a `status` field should have a status subresource.
              - "statussubresource"
              # Detects and reports when mutually exclusive markers are used on the same field
              - "conflictingmarkers"
              # Ensure every field has a json tag.
              - "jsontags"
              # Prevents usage of 'Timestamp' fields
              - "notimestamp"
            disable:
              # We will manually enable new linters after understanding the impact.
              # Disable all by default.
              - "*"
          lintersConfig:
            conflictingmarkers:
              conflicts:
                - name: "default_vs_required"
                  description: "A field with a default value cannot be required"
                  sets:
                    - [ "default", "kubebuilder:default" ]
                    - [ "required", "kubebuilder:validation:Required", "k8s:required" ]
  exclusions:
    generated: strict
    rules:
      ## KAL should only run on API folders.
      - path-except: "api/*"
        linters:
          - kubeapilinter
