apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../crd
- ../webhook

patches:
- target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: dscinitializations.dscinitialization.opendatahub.io
  path: ../crd/patches/webhook_in_dscinitialization_dscinitializations.yaml
- target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
    name: datascienceclusters.datasciencecluster.opendatahub.io
  path: ../crd/patches/webhook_in_datasciencecluster_datascienceclusters.yaml